<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>東京の週間天気</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fff;
      color: #333;
    }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    canvas { width: 100% !important; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 32px;
      font-size: 0.9rem;
    }
    th, td {
      text-align: center;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    th { color: #888; font-weight: normal; }
  </style>
</head>
<body>
  <h1>東京の週間天気</h1>

  {% if error %}
    <p style="color:red">エラー: {{ error }}</p>
  {% else %}
  <canvas id="chart"></canvas>
  {% endif %}

  <table>
    <tr>
      <th>日付</th>
      <th>天気</th>
      <th>最高</th>
      <th>最低</th>
    </tr>
    {% for d in forecast %}
    <tr>
      <td>{{ d.date }}</td>
      <td>{{ d.desc }}</td>
      <td>{{ d.temp_max }}°C</td>
      <td>{{ d.temp_min }}°C</td>
    </tr>
    {% endfor %}
  </table>

  <script>
    const labels = [{% for d in forecast %}"{{ d.date }}",{% endfor %}];
    const high   = [{% for d in forecast %}{{ d.temp_max }},{% endfor %}];
    const low    = [{% for d in forecast %}{{ d.temp_min }},{% endfor %}];

    new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "最高気温",
            data: high,
            borderColor: "#e74c3c",
            backgroundColor: "rgba(231,76,60,0.08)",
            tension: 0.3,
            fill: true,
          },
          {
            label: "最低気温",
            data: low,
            borderColor: "#3498db",
            backgroundColor: "rgba(52,152,219,0.08)",
            tension: 0.3,
            fill: true,
          },
        ],
      },
      options: {
        plugins: { legend: { position: "top" } },
        scales: {
          y: { ticks: { callback: v => v + "°C" } },
        },
      },
    });
  </script>
</body>
</html>
